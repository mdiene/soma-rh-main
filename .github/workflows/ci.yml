name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scan-pii.sh
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # identique au build Vercel : tsc -b && vite build
      - run: npm run lint
      - run: npm run build
      - run: node --test ../tests/unit/*.test.mjs
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-migrations.sh
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # base neuve = instantané db/baseline + migrations postérieures à la coupure ; échoue à la première erreur
      - run: bash scripts/replay-migrations.sh --keep
      # SEC-06 : aucune fonction public exécutable par anon (échoue en premier, message dédié)
      - run: bash scripts/ci-sql-tests.sh rpc_droits
      # ARCH-02 : tous les tests SQL sur la base reconstruite (ROAD-05). verify-payroll : en attente de DEC-03
      - run: bash scripts/ci-sql-tests.sh
